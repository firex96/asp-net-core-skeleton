# 로컬 개발용 인프라. Local 프로파일(appsettings.Local.json)의 연결 문자열과 짝이다.
#   docker compose up -d      # 기동 — SQL Server · Redis · Mailpit · mock OAuth. mssql-init 이 skeleton DB 를 만들고 끝난다
#   docker compose down -v    # 데이터까지 삭제
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # 공식 이미지는 amd64 만 있다 — Apple Silicon 은 에뮬레이션으로 돈다
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Skeleton!Passw0rd}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Skeleton!Passw0rd}
    entrypoint:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "IF DB_ID('skeleton') IS NULL CREATE DATABASE skeleton"
    restart: "no"

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 로컬 메일 수신함 — SMTP 1025 로 받은 메일을 웹 UI http://localhost:8025 에서 본다(밖으로 보내지 않는다).
  # 앱은 언제나 SMTP 인증을 하므로 아무 계정이나 받게 한다.
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # 소셜 로그인 공급자 흉내 — Google · Kakao · Naver 를 issuer 하나씩(/google · /kakao · /naver)으로 흉내 낸다.
  # 로그인 화면 없이 곧바로 고정된 사용자로 돌아온다(docker/mock-oauth2-server.json). 실제 공급자 자격증명 없이 흐름을 끝까지 본다.
  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.8
    environment:
      JSON_CONFIG_PATH: /config/mock-oauth2-server.json
    volumes:
      - ./docker/mock-oauth2-server.json:/config/mock-oauth2-server.json:ro
    ports:
      - "${MOCK_OAUTH_PORT:-8090}:8080"

volumes:
  mssql-data:
