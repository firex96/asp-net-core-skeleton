<header>
  <a routerLink="/">AspNetCoreSkeletonApplication</a>
  <nav>
    @if (auth.user(); as user) {
      <span class="user">{{ user.email }}</span>
      <button type="button" (click)="logout()">Log out</button>
    } @else if (auth.user() === null) {
      <a routerLink="/login" [queryParams]="loginQueryParams">Log in</a>
    }
  </nav>
</header>

<router-outlet />
