name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치 · PR 에 새 커밋이 오면 앞 실행을 멈춘다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # SPA 의 package.json(volta.node)과 같은 버전
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: src/spa/*/package-lock.json

      # dotnet build 가 SPA esproj 를 빌드하려면, 브라우저 테스트가 SPA 를 빌드하려면 의존성이 있어야 한다.
      - name: SPA dependencies
        run: |
          for spa in src/spa/*/; do
            (cd "$spa" && npm ci)
          done

      # 있는 SPA 를 모두 돈다 — 템플릿으로 SPA 하나만 골라 만든 프로젝트에서도 그대로 쓴다. 타입 검사는 스크립트가 있는 SPA(SvelteKit · Nuxt)만.
      - name: SPA tests and type checks
        run: |
          for spa in src/spa/*/; do
            (cd "$spa" && npm test -- --watch=false && npm run check --if-present)
          done

      - name: Build
        run: dotnet build AspNetCoreSkeletonApplication.slnx

      # 브라우저 테스트의 Chromium 과 리눅스 라이브러리 — fixture 는 브라우저만 받는다.
      - name: Chromium for browser tests
        run: pwsh test/e2e-tests/AspNetCoreSkeletonApplication.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # 단위 · 기능 · 통합(Testcontainers — 러너의 Docker) · 브라우저(Playwright) 전부. 테스트 프로젝트는 하나씩 돈다 —
      # 통합 테스트가 컨테이너를 띄우고 내리면 리눅스 호스트의 네트워크 인터페이스가 바뀌고, 그때 Chromium 이 진행 중인 요청을
      # net::ERR_NETWORK_CHANGED 로 끊는다.
      - name: Test
        run: dotnet test --solution AspNetCoreSkeletonApplication.slnx --max-parallel-test-modules 1

      - name: Test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/**
            test/e2e-tests/**/playwright-traces/**
          if-no-files-found: ignore
